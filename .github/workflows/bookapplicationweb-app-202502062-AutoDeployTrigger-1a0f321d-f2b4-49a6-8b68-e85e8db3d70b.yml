name: Trigger auto deployment for bookapplicationweb-app-202502062

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/bookapplicationweb-app-202502062-AutoDeployTrigger-1a0f321d-f2b4-49a6-8b68-e85e8db3d70b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.BOOKAPPLICATIONWEBAPP202502062_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BOOKAPPLICATIONWEBAPP202502062_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BOOKAPPLICATIONWEBAPP202502062_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: bookapplicationwebfinkiabe.azurecr.io
          registryUsername: ${{ secrets.BOOKAPPLICATIONWEBAPP202502062_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BOOKAPPLICATIONWEBAPP202502062_REGISTRY_PASSWORD }}
          containerAppName: bookapplicationweb-app-202502062
          resourceGroup: EastUSGroup
          imageToBuild: bookapplicationwebfinkiabe.azurecr.io/bookapplicationweb-app-202502062:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


